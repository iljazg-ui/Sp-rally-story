<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>SP Rally Story Maker</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#111318;--line:#2a2e35;--text:#fff;--muted:#a7adb7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{display:grid;grid-template-columns:minmax(330px,440px) 1fr;min-height:100vh}
.controls{padding:20px;background:#0d0f13;border-right:1px solid var(--line);overflow:auto}
h1{margin:0 0 5px;font-size:23px}.sub{font-size:13px;color:var(--muted);margin-bottom:18px}
label{display:block;margin:13px 0 6px;font-size:12px;font-weight:800;color:#d9dce2}
input,textarea,select,button{width:100%;border:1px solid var(--line);border-radius:10px;background:#181b21;color:#fff;padding:11px 12px;font:inherit}
textarea{min-height:235px;resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{margin-top:12px;background:#fff;color:#050505;border:0;font-weight:900;cursor:pointer}
button.secondary{background:#22262e;color:white;border:1px solid #363b45}
.preview{display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 10%,#262b34,#090a0d 58%)}
canvas{width:min(430px,92vw);height:auto;aspect-ratio:9/16;background:#000;box-shadow:0 20px 60px #000;border-radius:5px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}
.pill{display:inline-block;padding:4px 8px;border:1px solid #343944;border-radius:999px;color:#c3c8d0;font-size:11px;margin-bottom:12px}
@media(max-width:880px){.app{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<section class="controls">
<div class="pill">SP Rally Sport</div>
<h1>Story Maker</h1>
<div class="sub">Uredi podatke in izvozi Story v velikosti 1080 × 1920.</div>

<label>Naslov relija</label>
<input id="event" value="RALLY '26">

<label>Lokacija</label>
<input id="location" value="FINLAND">

<div class="row">
<div><label>Dan</label><input id="day" value="PETEK"></div>
<div><label>Datum</label><input id="date" value="31/07"></div>
</div>

<label>Pisava</label>
<select id="font">
<option value="Arial">Arial</option>
<option value="Verdana">Verdana</option>
<option value="Tahoma">Tahoma</option>
<option value="Trebuchet MS">Trebuchet MS</option>
<option value="Georgia">Georgia</option>
<option value="Courier New">Courier New</option>
<option value="Impact">Impact</option>
</select>

<label>Ozadje</label>
<input id="background" type="file" accept="image/*">

<div class="row">
<div><label>Logotip 1</label><input id="logo1" type="file" accept="image/*"></div>
<div><label>Logotip 2</label><input id="logo2" type="file" accept="image/*"></div>
</div>

<label>Urnik — čas | etapa | opis</label>
<textarea id="schedule">06:40 | | Odhod
07:44 | ES2 | Laukaa
08:45 | ES3 | Saarikas
09:50 | ES4 | Sydänmaa
10:58 | ES5 | Hoho
11:48 | | Regrouping
12:14 | | Servis
14:48 | ES6 | Laukaa
14:49 | ES7 | Saarikas
15:54 | ES8 | Sydänmaa
17:05 | ES9 | Hoho
18:05 | ES10 | Harju
18:40 | | Flexi servis
19:25 | | Parc fermé</textarea>

<div class="row">
<button id="download">IZVOZI PNG</button>
<button id="reset" class="secondary">PONASTAVI</button>
</div>
<div class="note">Na telefonu lahko izbereš fotografijo iz galerije. Vnosi se shranjujejo samo v tvojem brskalniku.</div>
</section>

<main class="preview"><canvas id="canvas" width="1080" height="1920"></canvas></main>
</div>

const defaults={event:"RALLY '26",location:"FINLAND",day:"PETEK",date:"31/07",font:"Arial",schedule:`06:40 | | Odhod
07:44 | ES2 | Laukaa
08:45 | ES3 | Saarikas
09:50 | ES4 | Sydänmaa
10:58 | ES5 | Hoho
11:48 | | Regrouping
12:14 | | Servis
14:48 | ES6 | Laukaa
14:49 | ES7 | Saarikas
15:54 | ES8 | Sydänmaa
17:05 | ES9 | Hoho
18:05 | ES10 | Harju
18:40 | | Flexi servis
19:25 | | Parc fermé`};
const ids=["event","location","day","date","font","schedule"];
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let bgImg=null, logoOne=new Image(), logoTwo=null;
logoOne.src=embeddedLogo;

function save(){
 const o={}; ids.forEach(id=>o[id]=document.getElementById(id).value);
 localStorage.setItem("spStoryV2",JSON.stringify(o));
}
function load(){
 try{const o=JSON.parse(localStorage.getItem("spStoryV2")||"{}");ids.forEach(id=>document.getElementById(id).value=o[id]??defaults[id]);}
 catch(e){ids.forEach(id=>document.getElementById(id).value=defaults[id]);}
}
function imgCover(img,x,y,w,h,opacity=1){
 if(!img||!img.complete||!img.naturalWidth)return;
 const s=Math.max(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;
 ctx.save();ctx.globalAlpha=opacity;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore();
}
function imgContain(img,x,y,w,h){
 if(!img||!img.complete||!img.naturalWidth)return;
 const s=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;
 ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function fit(text,max,start,weight,font){
 let s=start; do{ctx.font=`${weight} ${s}px "${font}"`;s-=2}while(ctx.measureText(text).width>max&&s>20);return s+2;
}
function entries(){
 return document.getElementById("schedule").value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{
  const p=line.split("|").map(x=>x.trim());
  return {time:p[0]||"",stage:p[1]||"",name:p.slice(2).join(" | ")||""};
 });
}
function draw(){
 save();
 const W=1080,H=1920,font=document.getElementById("font").value;
 ctx.clearRect(0,0,W,H);
 if(bgImg){imgCover(bgImg,0,0,W,H,1);ctx.fillStyle="rgba(0,0,0,.58)";ctx.fillRect(0,0,W,H);}
 else{
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#030303");g.addColorStop(.55,"#121315");g.addColorStop(1,"#020202");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
 ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle="#8a8d93";ctx.lineWidth=2;
 [[720,0,1080,300],[700,460,1080,720],[620,1350,1080,1510]].forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke()});
 ctx.font=`900 430px "${font}"`;ctx.strokeText("SP",260,1810);ctx.restore();

 imgContain(logoOne,65,65,640,190);
 imgContain(logoTwo,760,75,250,170);

 const ev=document.getElementById("event").value.toUpperCase(),loc=document.getElementById("location").value.toUpperCase();
 ctx.save();ctx.translate(405,325);ctx.rotate(-.035);
 let s=fit(ev,560,76,900,font);ctx.font=`900 ${s}px "${font}"`;let w=ctx.measureText(ev).width;
 ctx.fillStyle="#fff";ctx.fillRect(0,0,w+44,96);ctx.fillStyle="#050505";ctx.fillText(ev,22,73);
 ctx.translate(70,94);s=fit(loc,520,74,900,font);ctx.font=`900 ${s}px "${font}"`;w=ctx.measureText(loc).width;
 ctx.fillStyle="#fff";ctx.fillRect(0,0,w+44,94);ctx.fillStyle="#050505";ctx.fillText(loc,22,71);ctx.restore();

 ctx.fillStyle="#fff";ctx.font=`900 67px "${font}"`;ctx.fillText(document.getElementById("day").value.toUpperCase(),390,650);
 ctx.font=`900 78px "${font}"`;ctx.fillText(document.getElementById("date").value,390,730);

 const list=entries(),start=825,bottom=1725,gap=Math.min(72,Math.max(45,(bottom-start)/Math.max(list.length-1,1)));
 ctx.strokeStyle="rgba(255,255,255,.2)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(302,start-45);ctx.lineTo(302,start+(list.length-1)*gap+35);ctx.stroke();
 list.forEach((it,i)=>{
  const y=start+i*gap;
  ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font=`800 35px "${font}"`;ctx.fillText(it.time.toUpperCase(),260,y);
  ctx.textAlign="left";
  if(it.stage){ctx.font=`900 38px "${font}"`;ctx.fillText(it.stage.toUpperCase(),330,y);}
  ctx.font=`400 35px "${font}"`;ctx.fillStyle="#f2f2f2";ctx.fillText(it.name,450,y);
 });
 ctx.textAlign="left";ctx.fillStyle="rgba(255,255,255,.55)";ctx.font=`600 20px "${font}"`;ctx.fillText("SP RALLY SPORT",75,1855);
}
function fileToImg(input,cb){
 const f=input.files&&input.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=r.result};r.readAsDataURL(f);
}
ids.forEach(id=>document.getElementById(id).addEventListener("input",draw));
document.getElementById("background").addEventListener("change",e=>fileToImg(e.target,im=>{bgImg=im;draw()}));
document.getElementById("logo1").addEventListener("change",e=>fileToImg(e.target,im=>{logoOne=im;draw()}));
document.getElementById("logo2").addEventListener("change",e=>fileToImg(e.target,im=>{logoTwo=im;draw()}));
document.getElementById("download").addEventListener("click",()=>{
 draw();const a=document.createElement("a");
 a.download=((document.getElementById("event").value+"-"+document.getElementById("date").value).replace(/[^a-z0-9]+/gi,"-")||"sp-story")+".png";
 a.href=canvas.toDataURL("image/png");a.click();
});
document.getElementById("reset").addEventListener("click",()=>{
 localStorage.removeItem("spStoryV2");ids.forEach(id=>document.getElementById(id).value=defaults[id]);
 bgImg=null;logoTwo=null;logoOne=new Image();logoOne.onload=draw;logoOne.src=embeddedLogo;draw();
});
logoOne.onload=draw;load();draw();
</script>
